[package]
name = "hub"
version = "0.19.0"
description = "TaylorHub - instala, atualiza e abre os apps da suite Local"
authors = ["Joao / Taylor"]
edition = "2021"

[lib]
name = "hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
# Token do GitHub (opcional) no cofre do SO — DPAPI no Windows, Secret Service no Linux.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# Sleep assíncrono do polling do device flow (o reqwest já traz o tokio).
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
