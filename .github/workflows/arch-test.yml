# Banco de provas do `scripts/deb-to-arch.sh` — manual, não publica nada.
#
# Existe pra exercitar o repack contra um `.deb` DE VERDADE (baixado de uma
# release já publicada) sem precisar cortar uma release nova a cada tentativa.
# O caminho arriscado aqui é todo de ambiente — makepkg dentro do container,
# `bsdtar` lendo o container `ar`, o usuário sem privilégio — e nada disso é
# exercitável na máquina de desenvolvimento (que é Windows, sem Docker).
name: Testar repack pro Arch

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo de onde baixar o .deb (owner/repo)"
        required: true
        default: "Anon5T4R/LocalOffice"
      tag:
        description: "Tag da release"
        required: true
        default: "v0.16.7"

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Baixar um .deb de verdade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "${{ inputs.repo }}" \
            --pattern "*.deb" --dir dist
          ls -lh dist/

      - name: Reempacotar pro pacman
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb | head -1)"
          mkdir -p dist-arch
          chmod +x scripts/deb-to-arch.sh
          docker run --rm -v "$PWD:/w" -w /w archlinux:base-devel \
            ./scripts/deb-to-arch.sh "$deb" \
              "https://github.com/${{ inputs.repo }}" \
              "MIT" \
              "Teste de repack" \
              dist-arch

      # A prova que interessa: o pacote INSTALA de verdade num Arch limpo? Um
      # `.pkg.tar.zst` bem formado que o pacman recusa (dependência inexistente,
      # conflito de arquivo) é o modo de falha que só aparece aqui.
      - name: Instalar o pacote num Arch limpo
        run: |
          set -euo pipefail
          pkg="$(ls dist-arch/*.pkg.tar.zst | head -1)"
          # O nome sai do PRÓPRIO arquivo (`nome-versao-rel-arch.pkg.tar.zst`).
          # A primeira versão disto usava `pacman -Qq | tail -1`, que devolve o
          # último em ordem ALFABÉTICA — deu `zstd`, e a inspeção mostrou os
          # metadados de outro pacote com ar de sucesso.
          nome="$(basename "$pkg" | sed 's/-[^-]*-[^-]*-[^-]*\.pkg\.tar\.zst$//')"
          echo "pacote sob teste: $nome"
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c "
            set -euo pipefail
            pacman -Sy --noconfirm >/dev/null
            pacman -U --noconfirm '$pkg'
            echo '=== o que o pacman responde sobre ele ==='
            # É ESTA saída que o parse_pacman_query do Hub consome — conferir
            # contra o binário de verdade, não contra o formato que eu suponho.
            echo -n 'pacman -Q  -> '; pacman -Q '$nome'
            pacman -Qi '$nome'
            echo '=== arquivos instalados ==='
            pacman -Ql '$nome' | head -15
            echo '=== e a remocao funciona? ==='
            pacman -R --noconfirm '$nome'
            pacman -Q '$nome' 2>&1 || echo 'removido (o pacman nao o encontra mais)'
          "

      - uses: actions/upload-artifact@v6
        with:
          name: pacote-arch-teste
          path: dist-arch/*
          if-no-files-found: error
          retention-days: 3
